# Tells melvinator32/james-mcknight-personal-site to rebuild, which re-clones this
# repo, rebuilds the demo, and redeploys it to jamesmcknight.me/demos/blackjack-trainer/.
#
# Requires a repo secret named PORTFOLIO_DISPATCH_TOKEN: a fine-grained personal
# access token scoped to melvinator32/james-mcknight-personal-site with
# "Contents: Read and write" (the dispatches endpoint requires write).
#
# Without that secret this workflow fails harmlessly; the portfolio also rebuilds
# hourly on its own schedule, so the demo still updates within the hour.
name: Rebuild portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger portfolio rebuild
        env:
          TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/melvinator32/james-mcknight-personal-site/dispatches \
            -d '{"event_type":"demo-updated","client_payload":{"repo":"${{ github.repository }}","sha":"${{ github.sha }}"}}'
